region: us-east-1
metrics:

  # ── EC2 — works for ALL instances, no agent needed ─────────────────
  # Period 300 = 5 min (free tier). Use 60 for detailed monitoring (paid)
  - aws_namespace: AWS/EC2
    aws_metric_name: CPUUtilization
    aws_dimensions: [InstanceId]
    aws_statistics: [Average, Maximum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: NetworkIn
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: NetworkOut
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: StatusCheckFailed
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/EC2
    aws_metric_name: StatusCheckFailed_Instance
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/EC2
    aws_metric_name: StatusCheckFailed_System
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/EC2
    aws_metric_name: EBSReadBytes
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: EBSWriteBytes
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  # ── ECS ─────────────────────────────────────────────────────────────
  - aws_namespace: AWS/ECS
    aws_metric_name: CPUUtilization
    aws_dimensions: [ClusterName, ServiceName]
    aws_statistics: [Average, Maximum]
    period_seconds: 300

  - aws_namespace: AWS/ECS
    aws_metric_name: MemoryUtilization
    aws_dimensions: [ClusterName, ServiceName]
    aws_statistics: [Average, Maximum]
    period_seconds: 300

  # ── Lambda ───────────────────────────────────────────────────────────
  - aws_namespace: AWS/Lambda
    aws_metric_name: Invocations
    aws_dimensions: [FunctionName]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/Lambda
    aws_metric_name: Errors
    aws_dimensions: [FunctionName]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/Lambda
    aws_metric_name: Duration
    aws_dimensions: [FunctionName]
    aws_statistics: [Average, Maximum]
    period_seconds: 60

  - aws_namespace: AWS/Lambda
    aws_metric_name: Throttles
    aws_dimensions: [FunctionName]
    aws_statistics: [Sum]
    period_seconds: 60

  # ── API Gateway ──────────────────────────────────────────────────────
  - aws_namespace: AWS/ApiGateway
    aws_metric_name: Count
    aws_dimensions: [ApiName, Stage]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApiGateway
    aws_metric_name: 4XXError
    aws_dimensions: [ApiName, Stage]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApiGateway
    aws_metric_name: 5XXError
    aws_dimensions: [ApiName, Stage]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApiGateway
    aws_metric_name: Latency
    aws_dimensions: [ApiName, Stage]
    aws_statistics: [Average]
    period_seconds: 60

  # ── ALB ─────────────────────────────────────────────────────────────
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: RequestCount
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_Target_4XX_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_Target_5XX_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: TargetResponseTime
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Average]
    period_seconds: 60

  # ── RDS ─────────────────────────────────────────────────────────────
  - aws_namespace: AWS/RDS
    aws_metric_name: CPUUtilization
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
    period_seconds: 300

  - aws_namespace: AWS/RDS
    aws_metric_name: DatabaseConnections
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
    period_seconds: 60

  # ── SQS ─────────────────────────────────────────────────────────────
  - aws_namespace: AWS/SQS
    aws_metric_name: ApproximateNumberOfMessagesVisible
    aws_dimensions: [QueueName]
    aws_statistics: [Average]
    period_seconds: 60
