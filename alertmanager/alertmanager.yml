global:
  resolve_timeout: 5m

  # ── SMTP Settings — credentials loaded from AWS Secrets Manager ──────
  # Run: sudo bash scripts/load-smtp-secret.sh
  # This populates SMTP_HOST / SMTP_USER / SMTP_PASSWORD from
  # AWS Secrets Manager (secret: observability/ses-smtp)
  # NO passwords stored in this file or in .env
  smtp_smarthost:     '${SMTP_HOST:-email-smtp.us-east-1.amazonaws.com:587}'
  smtp_from:          '${SMTP_FROM:-observability-alerts@timesgroup.com}'
  smtp_auth_username: '${SMTP_USER:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'
  smtp_require_tls:   true

# ── Templates ─────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ══════════════════════════════════════════════════════════════════════
# ROUTING TREE
#
# Priority levels:
#   P1 (critical) → Email immediately + MS Teams + repeat every 1h
#   P2 (warning)  → Email + MS Teams + repeat every 4h
#   P3 (warning)  → Email daily digest + MS Teams
#
# continue: true means alert matches this route AND falls through
# to the next matching route (so both email + teams fire)
# ══════════════════════════════════════════════════════════════════════
route:
  receiver: 'msteams-default'
  group_by: ['alertname', 'priority', 'instance']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h

  routes:

    # ── P1 Critical — immediate email + teams, repeat every 1h ────────
    - match:
        priority: P1
      receiver: p1-critical
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: false

    # ── P2 High — email + teams, repeat every 4h ──────────────────────
    - match:
        priority: P2
      receiver: p2-high
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      continue: false

    # ── P3 Medium — email + teams, repeat every 12h ───────────────────
    - match:
        priority: P3
      receiver: p3-medium
      group_wait: 60s
      group_interval: 10m
      repeat_interval: 12h
      continue: false

    # ── SSL Expiry — separate routing ─────────────────────────────────
    - match_re:
        alertname: 'SSLCertExpired|SSLCertExpiringCritical'
      receiver: p1-critical
      repeat_interval: 6h
      continue: false

    - match:
        alertname: SSLCertExpiringSoon
      receiver: p2-high
      repeat_interval: 24h
      continue: false

# ══════════════════════════════════════════════════════════════════════
# RECEIVERS
# ══════════════════════════════════════════════════════════════════════
receivers:

  # ── Default (fallback) ─────────────────────────────────────────────
  - name: 'msteams-default'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  # ── P1 Critical — Email + MS Teams ────────────────────────────────
  - name: 'p1-critical'
    email_configs:
      - to: 'Santosh.mirajkar@timesgroup.com, samirajkar99@gmail.com'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        subject: '{{ template "email.subject" . }}'
        headers:
          X-Priority: '1'
          X-Alert-Priority: 'P1-Critical'
          Importance: 'high'
        smarthost: '${SMTP_HOST:-smtp.gmail.com:587}'
        from:      '${SMTP_FROM:-observability-alerts@gmail.com}'
        auth_username: '${SMTP_USER:-}'
        auth_password: '${SMTP_PASSWORD:-}'
        require_tls: true

    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  # ── P2 High — Email + MS Teams ─────────────────────────────────────
  - name: 'p2-high'
    email_configs:
      - to: 'Santosh.mirajkar@timesgroup.com, samirajkar99@gmail.com'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        subject: '{{ template "email.subject" . }}'
        headers:
          X-Priority: '2'
          X-Alert-Priority: 'P2-High'
        smarthost: '${SMTP_HOST:-smtp.gmail.com:587}'
        from:      '${SMTP_FROM:-observability-alerts@gmail.com}'
        auth_username: '${SMTP_USER:-}'
        auth_password: '${SMTP_PASSWORD:-}'
        require_tls: true

    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  # ── P3 Medium — Email + MS Teams ───────────────────────────────────
  - name: 'p3-medium'
    email_configs:
      - to: 'Santosh.mirajkar@timesgroup.com, samirajkar99@gmail.com'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        subject: '{{ template "email.subject" . }}'
        headers:
          X-Priority: '3'
          X-Alert-Priority: 'P3-Medium'
        smarthost: '${SMTP_HOST:-smtp.gmail.com:587}'
        from:      '${SMTP_FROM:-observability-alerts@gmail.com}'
        auth_username: '${SMTP_USER:-}'
        auth_password: '${SMTP_PASSWORD:-}'
        require_tls: true

    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

# ── Inhibit Rules ──────────────────────────────────────────────────────
# P1 suppresses P2/P3 for same alert on same instance
inhibit_rules:
  - source_match:
      priority: 'P1'
    target_match_re:
      priority: 'P2|P3'
    equal: ['alertname', 'instance']
  - source_match:
      priority: 'P2'
    target_match:
      priority: 'P3'
    equal: ['alertname', 'instance']
