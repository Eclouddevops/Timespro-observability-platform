global:
  resolve_timeout: 5m
  smtp_smarthost:   'email-smtp.us-east-1.amazonaws.com:587'
  smtp_from:        'observability-alerts@timesgroup.com'
  smtp_require_tls: true

# ── Templates ─────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ══════════════════════════════════════════════════════════════════════
# ROUTING TREE
# ══════════════════════════════════════════════════════════════════════
route:
  receiver: 'msteams-default'
  group_by: ['alertname', 'priority', 'instance']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h

  routes:

    - match:
        priority: P1
      receiver: p1-critical
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: false

    - match:
        priority: P2
      receiver: p2-high
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      continue: false

    - match:
        priority: P3
      receiver: p3-medium
      group_wait: 60s
      group_interval: 10m
      repeat_interval: 12h
      continue: false

    - match_re:
        alertname: 'SSLCertExpired|SSLCertExpiringCritical'
      receiver: p1-critical
      repeat_interval: 6h
      continue: false

    - match:
        alertname: SSLCertExpiringSoon
      receiver: p2-high
      repeat_interval: 24h
      continue: false

# ══════════════════════════════════════════════════════════════════════
# RECEIVERS
# ══════════════════════════════════════════════════════════════════════
receivers:

  - name: 'msteams-default'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'p1-critical'
    email_configs:
      - to: 'Santosh.mirajkar@timesgroup.com, samirajkar99@gmail.com'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        subject: '{{ template "email.subject" . }}'
        headers:
          X-Priority: '1'
          X-Alert-Priority: 'P1-Critical'
          Importance: 'high'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'p2-high'
    email_configs:
      - to: 'Santosh.mirajkar@timesgroup.com, samirajkar99@gmail.com'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        subject: '{{ template "email.subject" . }}'
        headers:
          X-Priority: '2'
          X-Alert-Priority: 'P2-High'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'p3-medium'
    email_configs:
      - to: 'Santosh.mirajkar@timesgroup.com, samirajkar99@gmail.com'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        subject: '{{ template "email.subject" . }}'
        headers:
          X-Priority: '3'
          X-Alert-Priority: 'P3-Medium'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

# ── Inhibit Rules ──────────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      priority: 'P1'
    target_match_re:
      priority: 'P2|P3'
    equal: ['alertname', 'instance']
  - source_match:
      priority: 'P2'
    target_match:
      priority: 'P3'
    equal: ['alertname', 'instance']
