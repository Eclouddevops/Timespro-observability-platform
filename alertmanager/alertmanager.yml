global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST:-localhost:587}'
  smtp_from: '${SMTP_FROM:-alerts@example.com}'
  smtp_auth_username: '${SMTP_USER:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'

# ─── Templates ────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ─── Route Tree ───────────────────────────────────────────────────────
route:
  receiver: 'msteams-default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    # Critical alerts → immediate notification
    - match:
        severity: critical
      receiver: msteams-critical
      group_wait: 0s
      repeat_interval: 1h
      continue: true

    # SSL expiry alerts
    - match_re:
        alertname: 'SSLCertExpiring.*|SSLCertExpired'
      receiver: msteams-ssl
      repeat_interval: 6h

    # ECS alerts
    - match:
        service_type: ecs
      receiver: msteams-ecs
      group_by: ['alertname', 'service_name']

    # Lambda alerts
    - match:
        service_type: lambda
      receiver: msteams-lambda
      group_by: ['alertname', 'function_name']

    # API Gateway alerts
    - match:
        service_type: api-gateway
      receiver: msteams-api
      group_by: ['alertname', 'api_name']

    # WAF alerts
    - match:
        service_type: waf
      receiver: msteams-waf
      group_wait: 30s
      repeat_interval: 24h

# ─── Receivers ────────────────────────────────────────────────────────
# All receivers post to alertmanager-msteams proxy (port 2000)
# which converts alerts into MS Teams Adaptive Cards.
# Each receiver maps to a named "connector" in msteams-config.yml
# ──────────────────────────────────────────────────────────────────────
receivers:

  - name: 'msteams-default'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true
        http_config:
          tls_config:
            insecure_skip_verify: false

  - name: 'msteams-critical'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'msteams-ssl'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'msteams-ecs'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'msteams-lambda'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'msteams-api'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

  - name: 'msteams-waf'
    webhook_configs:
      - url: 'http://alertmanager-msteams:2000/alertmanager'
        send_resolved: true

# ─── Inhibit Rules ────────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
