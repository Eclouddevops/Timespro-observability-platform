# Website & API Endpoint Monitoring
# Probed by Blackbox Exporter every 60s (HTTP 200 check)
# Add your URLs below — Prometheus auto-reloads this file every 30s
# ══════════════════════════════════════════════════════════════════════

# ── Main Website ───────────────────────────────────────────────────────
- targets:
    - 'https://aiobz.com'
    - 'https://www.aiobz.com'
  labels:
    env: production
    service: website
    category: main
    owner: eclouddevops

