# ══════════════════════════════════════════════════════════════════════
# SSL Certificate Expiry Monitoring
# Checked by SSL Exporter every 5 minutes
# Alerts: WARNING at 30 days, CRITICAL at 7 days before expiry
# ══════════════════════════════════════════════════════════════════════

# ── Main Website SSL ───────────────────────────────────────────────────
- targets:
    - 'aiobz.com:443'
    - 'www.aiobz.com:443'
  labels:
    env: production
    service: ssl
    category: main
    owner: eclouddevops

