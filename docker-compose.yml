networks:
  monitoring:
    driver: bridge
  ai-agent:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  ec2_textfiles:

services:

  # ─────────────────────────────────────────────
  # PROMETHEUS
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
      # Mount textfiles so Prometheus can read them directly
      - ec2_textfiles:/ec2_textfiles:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # ALERTMANAGER
  # ─────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # GRAFANA
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-ChangeMe2024!}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel,grafana-worldmap-panel
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # LOKI
  # ─────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # PROMTAIL
  # ─────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.5
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # ─────────────────────────────────────────────
  # NODE EXPORTER — host metrics only
  # NOTE: Port 9100 used by host systemd service.
  # We map to port 9101 on host to avoid conflict.
  # Prometheus scrapes via container name (internal port 9100).
  # ─────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ec2_textfiles:/textfiles:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfiles'
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # CADVISOR
  # ─────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # CLOUDWATCH EXPORTER
  # Already working — has aws_ec2_* metrics
  # ─────────────────────────────────────────────
  cloudwatch-exporter:
    image: prom/cloudwatch-exporter:latest
    container_name: cloudwatch-exporter
    restart: unless-stopped
    ports:
      - "9106:9106"
    volumes:
      - ./exporters/cloudwatch/config.yml:/config/config.yml:ro
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # ALERTMANAGER MS TEAMS PROXY
  # ─────────────────────────────────────────────
  alertmanager-msteams:
    image: bzon/prometheus-msteams:latest
    container_name: alertmanager-msteams
    restart: unless-stopped
    ports:
      - "2000:2000"
    environment:
      - TEAMS_INCOMING_WEBHOOK_URL=${MSTEAMS_WEBHOOK_URL:-}
      - TEAMS_REQUEST_TIMEOUT=30s
    volumes:
      - ./alertmanager/msteams-config.yml:/etc/alertmanager-msteams/config.yml:ro
    command:
      - --config=/etc/alertmanager-msteams/config.yml
    networks:
      - monitoring
    depends_on:
      - alertmanager

  # ─────────────────────────────────────────────
  # EC2 AUTO-DISCOVERY AGENT v4
  # Writes ec2_metrics.prom to shared volume
  # node-exporter reads it via textfile collector
  # ─────────────────────────────────────────────
  auto-discovery:
    build:
      context: ./auto-discovery
      dockerfile: Dockerfile
    container_name: ec2-auto-discovery
    restart: unless-stopped
    ports:
      - "9877:9877"
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_REGIONS=${AWS_REGIONS:-us-east-1}
      - DISCOVERY_INTERVAL_MINUTES=${DISCOVERY_INTERVAL_MINUTES:-2}
      - PRIMARY_ACCOUNT_NAME=${PRIMARY_ACCOUNT_NAME:-production}
      - TAG_FILTER_KEY=${TAG_FILTER_KEY:-}
      - TAG_FILTER_VALUE=${TAG_FILTER_VALUE:-true}
      - MSTEAMS_WEBHOOK_URL=${MSTEAMS_WEBHOOK_URL:-}
      - PROM_TEXTFILE_DIR=/textfiles
    volumes:
      - ec2_textfiles:/textfiles
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # BLACKBOX EXPORTER
  # ─────────────────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./exporters/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # SSL EXPORTER
  # ─────────────────────────────────────────────
  ssl-exporter:
    image: ribbybibby/ssl-exporter:latest
    container_name: ssl-exporter
    restart: unless-stopped
    ports:
      - "9219:9219"
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # AI OBSERVABILITY AGENT
  # ─────────────────────────────────────────────
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ai-observability-agent
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MSTEAMS_WEBHOOK_URL=${MSTEAMS_WEBHOOK_URL:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    networks:
      - monitoring
      - ai-agent
    depends_on:
      - prometheus
      - grafana

  # ─────────────────────────────────────────────
  # NGINX REVERSE PROXY
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - monitoring
    depends_on:
      - grafana
      - prometheus
